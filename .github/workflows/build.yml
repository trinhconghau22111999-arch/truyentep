name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/google-services.json

      - name: Doi package_name trong google-services.json sang ID app moi
        run: |
          python3 - <<'PY'
          import json
          p = "app/google-services.json"
          d = json.load(open(p))
          for c in d.get("client", []):
              c["client_info"]["android_client_info"]["package_name"] = "com.hau.truyentep"
          json.dump(d, open(p, "w"), indent=2)
          PY

      - name: Decode keystore co dinh
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: truyentep-apk
          path: app/build/outputs/apk/debug/app-debug.apk
